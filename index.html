  #start{position:fixed;inset:0;background:rgba(253,246,236,.96);display:flex;

  #start h1{font-size:clamp(21px,4vw,32px);margin:0;color:#3f8f89;font-weight:900;}

  #start button{border:none;border-radius:999px;padding:14px 44px;font-family:var(--font-head);

    #readout{width:166px;padding:7px 10px;top:60px;} #rdBig{font-size:15px;} .row{font-size:11px;}
    #graphBox{width:150px;} #graph{height:46px;} #graphBox .t{font-size:9.5px;}
    #infobar{left:170px;right:162px;font-size:11.5px;line-height:1.5;padding:7px 11px;}

    #quiz{max-width:94vw;padding:11px 13px;} #quiz .q{font-size:13.5px;}
    #quiz .opts button{font-size:13px;padding:8px 13px;}
  }
</style>

<div id="start">

<script src="three.min.js"></script>
<script>
'use strict';
/* ==========================================================================
   電磁誘導ラボ3D  c2-4-3-c（中2理科 単元4-3 p.276-279）
   教科書に合わせた点：
   ・検流計は真ん中が0。＋端子から電流が流れこむと右、－端子からだと左に振れる（p.277）
   ・磁石は「コイルをつきぬけないように」動かす（p.277 実験8の注意）
   ・近づけるときと遠ざけるときで誘導電流の向きは逆（p.278）
   ・磁石の極を変えても向きは逆。巻数が多い/強い磁石だと大きい（p.278）
   ・止めているときは流れない（p.278 図1の真ん中）
   ・誘導電流の向き（レンツの法則）は「発展・高校」（p.278）
   ========================================================================== */
const TERMS = {
  induction:'電磁誘導', current:'誘導電流', galv:'検流計',
  coil:'コイル', magnet:'棒磁石', turns:'巻数',
  lenz:'誘導電流の向き'
};
const T = TERMS;

const VW=()=>Math.max(1, innerWidth||1280), VH=()=>Math.max(1, innerHeight||800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(VW(),VH());
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xfdf6ec);
const camera=new THREE.PerspectiveCamera(45, VW()/VH(), .1, 100);
const camHome={az:0.86, el:0.24, dist:9.4};
let camAz=camHome.az, camEl=camHome.el, camDist=camHome.dist;
const camTarget=new THREE.Vector3(0.05,-0.42,0.35);

scene.add(new THREE.HemisphereLight(0xfffaf0,0xc9b8a4,0.85));
const sun=new THREE.DirectionalLight(0xfff2dc,1.0);
sun.position.set(4,9,6); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-7; sun.shadow.camera.right=7;
sun.shadow.camera.top=7; sun.shadow.camera.bottom=-5;
scene.add(sun);

/* ---------- 寸法 ---------- */
const COIL_R=0.78, COIL_LEN=1.34;
const MAG_LEN=1.22, MAG_R=0.19;
const Z_NEAR=0.05;   // コイルの中まで入る。ただし反対側へは出ない（教科書p.277の注意）
const Z_FAR =3.85;
const GALV_POS=new THREE.Vector3(0.35,-1.42,-2.05);

/* ---------- 状態 ---------- */
const S={
  mode:'move',
  z:Z_FAR, vz:0, prevZ:Z_FAR,
  pole:1,            // +1: N極がコイル側 / -1: S極がコイル側
  turnsDouble:false, // 巻数2倍
  strong:false,      // 強い磁石
  auto:false, autoT:0,
  spin:false, spinSpeed:5, spinAngle:0,
  emf:0, needle:0,
  showLenz:false,
  quiz:null, dragging:false
};
function turnsN(){ return S.turnsDouble ? 2 : 1; }
function magStrength(){ return S.strong ? 1.8 : 1.0; }

/* ---------- 誘導起電力（ファラデーの法則） ----------
   Φ(z) ∝ 強さ×極 /(1+(z/a)^2)^{3/2}     V = -N dΦ/dt = -N (dΦ/dz)(dz/dt)  */
const FLUX_A=1.25;
function dFluxdz(z){
  const u=z/FLUX_A;
  return -3*magStrength()*S.pole*z / (FLUX_A*FLUX_A*Math.pow(1+u*u,2.5));
}
function computeEmf(dt){
  if(S.mode==='gen'){
    // 発電機：磁石が回転してコイルに近づいたり遠ざかったりする（p.278 まちなか科学）
    const w=(0.6+S.spinSpeed*0.55);
    if(S.spin) S.spinAngle+=w*dt;
    const zEq=2.15+1.0*Math.cos(S.spinAngle);
    const vEq=S.spin ? -1.0*Math.sin(S.spinAngle)*w : 0;
    S.z=zEq; S.vz=vEq;
  }else{
    S.vz = dt>0 ? (S.z-S.prevZ)/dt : 0;
  }
  S.prevZ=S.z;
  const raw = -turnsN()*dFluxdz(S.z)*S.vz;
  // 見やすいスケールに整える
  return raw*1.9;
}

/* ---------- 材質 ---------- */
const matCopper=new THREE.MeshStandardMaterial({color:0xc97b4a,roughness:.34,metalness:.62});
const matN=new THREE.MeshStandardMaterial({color:0xd0304a,roughness:.45});
const matS=new THREE.MeshStandardMaterial({color:0x2f6fc0,roughness:.45});
const matBody=new THREE.MeshStandardMaterial({color:0x8c9299,roughness:.6,metalness:.25});
const matDark=new THREE.MeshStandardMaterial({color:0x6c737a,roughness:.6});
const matWire=new THREE.MeshStandardMaterial({color:0xb5763f,roughness:.4,metalness:.5});

/* ---------- ラベル ---------- */
function makeLabel(text,color,size,bold){
  const fs=64,pad=8;
  const c=document.createElement('canvas'); let g=c.getContext('2d');
  g.font=(bold?'900 ':'700 ')+fs+'px "Zen Maru Gothic", sans-serif';
  c.width=Math.ceil(g.measureText(text).width)+pad*2; c.height=fs+pad*2;
  g=c.getContext('2d');
  g.font=(bold?'900 ':'700 ')+fs+'px "Zen Maru Gothic", sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=9; g.strokeStyle='rgba(253,246,236,.95)';
  g.strokeText(text,c.width/2,c.height/2);
  g.fillStyle=color; g.fillText(text,c.width/2,c.height/2);
  const tx=new THREE.CanvasTexture(c); tx.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));
  const h=size||0.28; sp.scale.set(h*c.width/c.height,h,1); sp.renderOrder=20;
  return sp;
}
function makeArrow(len,color,headR){
  const g=new THREE.Group();
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(headR*0.38,headR*0.38,len,10),
    new THREE.MeshStandardMaterial({color,roughness:.4}));
  sh.position.y=len/2;
  const hd=new THREE.Mesh(new THREE.ConeGeometry(headR,headR*2.1,12),
    new THREE.MeshStandardMaterial({color,roughness:.4}));
  hd.position.y=len+headR*1.05;
  g.add(sh,hd); g.userData.len=len; return g;
}
function aimArrow(g,from,dir,len){
  const d=dir.clone(); if(d.lengthSq()<1e-9){g.visible=false;return;}
  d.normalize(); g.visible=true; g.position.copy(from);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);
  g.scale.set(1,len/g.userData.len,1);
}

/* ---------- 台 ---------- */
{
  const base=new THREE.Mesh(new THREE.BoxGeometry(8.2,0.16,4.2),
    new THREE.MeshStandardMaterial({color:0xefe6d6,roughness:.92}));
  base.position.y=-2.18; base.receiveShadow=true; scene.add(base);
}

/* ---------- コイル ---------- */
const coilGroup=new THREE.Group(); scene.add(coilGroup);
let coilMesh=null;
function buildCoil(){
  if(coilMesh){ coilMesh.geometry.dispose(); coilGroup.remove(coilMesh); }
  const n = S.turnsDouble ? 14 : 7;
  class Helix extends THREE.Curve{
    getPoint(t){
      const a=t*n*Math.PI*2;
      return new THREE.Vector3(COIL_R*Math.cos(a), COIL_R*Math.sin(a), -COIL_LEN/2+t*COIL_LEN);
    }
  }
  coilMesh=new THREE.Mesh(new THREE.TubeGeometry(new Helix(), n*26, 0.052, 8), matCopper);
  coilMesh.castShadow=true;
  coilGroup.add(coilMesh);
}
buildCoil();
const lblCoil=makeLabel(T.coil,'#a5622f',0.27); scene.add(lblCoil);

/* ---------- 棒磁石 ---------- */
const magGroup=new THREE.Group(); scene.add(magGroup);
const magNear=new THREE.Mesh(new THREE.CylinderGeometry(MAG_R,MAG_R,MAG_LEN/2,20), matN);
const magFar =new THREE.Mesh(new THREE.CylinderGeometry(MAG_R,MAG_R,MAG_LEN/2,20), matS);
magNear.rotation.x=Math.PI/2; magFar.rotation.x=Math.PI/2;
magNear.position.z=-MAG_LEN/4; magFar.position.z=MAG_LEN/4;
magNear.castShadow=magFar.castShadow=true;
magGroup.add(magNear,magFar);
const poleNearN=makeLabel('N','#d0304a',0.42,true), poleNearS=makeLabel('S','#2f6fc0',0.42,true);
const poleFarN =makeLabel('N','#d0304a',0.42,true), poleFarS =makeLabel('S','#2f6fc0',0.42,true);
scene.add(poleNearN,poleNearS,poleFarN,poleFarS);
const lblHand=makeLabel('手で動かす','#5a4a3a',0.24); scene.add(lblHand);

/* ---------- 検流計 ---------- */
const galv=new THREE.Group(); galv.position.copy(GALV_POS); scene.add(galv);
let needleMesh=null;
{
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.25,0.62), matBody);
  body.castShadow=true; galv.add(body);
  const face=new THREE.Mesh(new THREE.CircleGeometry(0.66,32),
    new THREE.MeshStandardMaterial({color:0xfffdf6,roughness:.5}));
  face.position.set(0,0.1,0.32); galv.add(face);
  const bezel=new THREE.Mesh(new THREE.TorusGeometry(0.67,0.038,10,36),
    new THREE.MeshStandardMaterial({color:0x5f666d,roughness:.5,metalness:.4}));
  bezel.position.set(0,0.1,0.33); galv.add(bezel);
  // 目盛り
  for(let i=-4;i<=4;i++){
    const a=i*0.19;
    const tick=new THREE.Mesh(new THREE.BoxGeometry(0.022,(i===0?0.16:0.1),0.02), matDark);
    tick.position.set(Math.sin(a)*0.53, 0.1+Math.cos(a)*0.53, 0.335);
    tick.rotation.z=-a; galv.add(tick);
  }
  needleMesh=new THREE.Mesh(new THREE.BoxGeometry(0.032,0.62,0.022),
    new THREE.MeshStandardMaterial({color:0xd0304a,roughness:.5}));
  needleMesh.position.set(0,0.1,0.35);
  needleMesh.geometry.translate(0,0.28,0);
  galv.add(needleMesh);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.05,14), matDark);
  hub.rotation.x=Math.PI/2; hub.position.set(0,0.1,0.36); galv.add(hub);

let actx=null;
function ensureAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }
function blip(f,d,g0,type){
  if(!actx) return;
  const t0=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(g0,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+d+0.05);
}
function ding(){blip(1320,0.45,0.14);blip(1980,0.35,0.05);}

const gcv=document.getElementById('graph'), gctx=gcv.getContext('2d');
const HIST=[];
function drawGraph(){
  const w=gcv.width,h=gcv.height;
  gctx.clearRect(0,0,w,h);
  gctx.strokeStyle='#e6dccb'; gctx.lineWidth=2;
  gctx.beginPath(); gctx.moveTo(0,h/2); gctx.lineTo(w,h/2); gctx.stroke();
  if(HIST.length<2) return;
  gctx.lineWidth=3; gctx.lineJoin='round';
  gctx.beginPath();
  for(let i=0;i<HIST.length;i++){
    const x=w*i/(HIST.length-1);
    const y=h/2 - Math.max(-1,Math.min(1,HIST[i]))*(h/2-6);
    i? gctx.lineTo(x,y) : gctx.moveTo(x,y);
  }
  const last=HIST[HIST.length-1];
  gctx.strokeStyle = last>=0 ? '#e0574f' : '#3f7fc9';
  gctx.stroke();
}

const LABEL_ORDER=[];
function registerLabels(){
  LABEL_ORDER.length=0;
  [poleNearN,poleNearS,poleFarN,poleFarS,lblCoil,lblGalv,lblHand,lblPlus,lblMinus,lblLenzM,lblLenzI]
    .forEach(sp=>{sp.material.transparent=true; sp.userData.op=1; LABEL_ORDER.push(sp);});
}
let panelRects=[];
function refreshPanelRects(){
  panelRects=['topbar','readout','ctrl','infobar','graphBox'].map(id=>{
    const el=$(id); if(!el||el.style.display==='none') return null;
    const r=el.getBoundingClientRect();
    return (r.width>0&&r.height>0)?{x:r.left,y:r.top,w:r.width,h:r.height}:null;
  }).filter(Boolean);
}
const _cr=new THREE.Vector3(),_cu=new THREE.Vector3(),_cf=new THREE.Vector3();
function labelRect(sp,W,H){
  const wp=sp.getWorldPosition(new THREE.Vector3());
  const c=wp.clone().project(camera);
  const r=wp.clone().addScaledVector(_cr,sp.scale.x/2).project(camera);
  const u=wp.clone().addScaledVector(_cu,sp.scale.y/2).project(camera);
  const cx=(c.x*.5+.5)*W, cy=(-c.y*.5+.5)*H;
  const hw=Math.abs((r.x*.5+.5)*W-cx), hh=Math.abs((-u.y*.5+.5)*H-cy);
  return {x:cx-hw,y:cy-hh,w:2*hw,h:2*hh,behind:c.z>1};
}
function boxOverlap(a,b){
  const w=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);
  const h=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
  return Math.max(0,w)*Math.max(0,h);
}
function updateLabelVisibility(dt){
  const W=renderer.domElement.clientWidth||VW(), H=renderer.domElement.clientHeight||VH();
  camera.matrixWorld.extractBasis(_cr,_cu,_cf);
  const placed=[];
  for(const sp of LABEL_ORDER){
    if(!sp.visible){ sp.userData.op=0; sp.material.opacity=0; continue; }
    const r=labelRect(sp,W,H);
    const ok=!r.behind && r.x>=0 && r.y>=0 && r.x+r.w<=W && r.y+r.h<=H
      && !panelRects.some(p=>boxOverlap(r,p)>6)
      && !placed.some(q=>boxOverlap(r,q)>6);
    sp.userData.op += ((ok?1:0)-sp.userData.op)*Math.min(1,dt*9);
    sp.material.opacity=sp.userData.op;
    if(ok) placed.push(r);
  }
}

/* ---------- カメラ＋磁石のドラッグ ---------- */
let dragging=false,lastX=0,lastY=0;
const touches=new Map(); let pinchPrev=0;
let userZoomed=false;
const FIT_H=6.6, FIT_W=8.6;
function autoFit(){
  if(userZoomed) return;
  const vh=2*Math.tan(camera.fov*Math.PI/360);
  const asp=(isFinite(camera.aspect)&&camera.aspect>0)?camera.aspect:VW()/VH();
  const d=Math.max(camHome.dist,FIT_H/vh,FIT_W/(vh*Math.max(asp,0.35)));
  if(isFinite(d)) camDist=Math.min(22,d);
}
function pinchSpan(){const a=[...touches.values()];
  return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
function setDist(d){ camDist=Math.max(4.5,Math.min(22,d)); }
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pickMagnet(e){
  const rect=renderer.domElement.getBoundingClientRect();
  ndc.x=((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  return raycaster.intersectObjects([magNear,magFar],false).length>0;
}
/* 画面上のドラッグ量を、コイルの軸(z)方向の移動量に変換する */
function screenAxisDelta(dx,dy){
  const p0=new THREE.Vector3(0,0,S.z).project(camera);
  const p1=new THREE.Vector3(0,0,S.z+1).project(camera);
  const ax=(p1.x-p0.x)*renderer.domElement.clientWidth/2;
  const ay=-(p1.y-p0.y)*renderer.domElement.clientHeight/2;
  const len2=ax*ax+ay*ay;
  if(len2<1e-6) return 0;
  return (dx*ax+dy*ay)/len2;
}
renderer.domElement.addEventListener('pointerdown', e=>{
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===1){
    lastX=e.clientX; lastY=e.clientY;
    if(S.mode==='move' && pickMagnet(e)){
      S.dragging=true; S.auto=false;
      $('btnAuto').querySelector('.st').textContent='OFF'; $('btnAuto').classList.add('off');
    } else dragging=true;
  } else { dragging=false; S.dragging=false; pinchPrev=pinchSpan(); }
});
function endPointer(e){ touches.delete(e.pointerId); dragging=false; S.dragging=false; pinchPrev=0; }
addEventListener('pointerup',endPointer);
addEventListener('pointercancel',endPointer);
addEventListener('pointermove', e=>{
  if(touches.has(e.pointerId)) touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size>=2){
    const d=pinchSpan();
    if(pinchPrev>0&&d>0){ setDist(camDist*(pinchPrev/d)); userZoomed=true; }
    pinchPrev=d; return;
  }
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(S.dragging){
    S.z=Math.max(Z_NEAR,Math.min(Z_FAR, S.z+screenAxisDelta(dx,dy)));
    $('posSlider').value=sliderFromZ(S.z);
    $('posVal').textContent=posWord(+$('posSlider').value);
  }else if(dragging){
    camAz=Math.max(-1.4,Math.min(1.4,camAz-dx*0.006));
    camEl=Math.max(-0.1,Math.min(1.0,camEl+dy*0.005));
  }
  lastX=e.clientX; lastY=e.clientY;
});
addEventListener('wheel', e=>{ setDist(camDist+e.deltaY*0.004); userZoomed=true; });
addEventListener('resize', ()=>{
  camera.aspect=VW()/VH(); camera.updateProjectionMatrix();
  renderer.setSize(VW(),VH()); autoFit(); refreshPanelRects();
});

/* ---------- メインループ ---------- */
const clock=new THREE.Clock();
let gTimer=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  // 自動で出し入れ
  if(S.mode==='move' && S.auto){
    S.autoT+=dt*1.25;
    S.z=Z_NEAR+0.15+(Z_FAR-Z_NEAR-0.3)*(0.5-0.5*Math.cos(S.autoT));
    $('posSlider').value=sliderFromZ(S.z);
  }
  S.emf=computeEmf(dt);
  // 針は少し遅れて動く（実物の検流計に近づける）
  S.needle += (Math.max(-1.2,Math.min(1.2,S.emf)) - S.needle)*Math.min(1,dt*11);
  if(Math.abs(S.needle)<0.002) S.needle=0;
  updateScene(dt);
  updateLabelVisibility(dt);
  gTimer+=dt;
  if(gTimer>0.03){
    gTimer=0;
    HIST.push(S.needle);
    if(HIST.length>200) HIST.shift();
    drawGraph();
  }
  camera.position.set(
    camTarget.x+camDist*Math.cos(camEl)*Math.sin(camAz),
    camTarget.y+camDist*Math.sin(camEl),
    camTarget.z+camDist*Math.cos(camEl)*Math.cos(camAz));
  camera.lookAt(camTarget);
  renderer.render(scene,camera);
}

/* ---------- 初期化 ---------- */
const params=new URLSearchParams(location.search);
if(params.get('skip')==='1') $('start').style.display='none';
if(params.get('mode')==='gen') setMode('gen'); else setMode('move');
if(params.get('pole')==='-1') S.pole=-1;
if(params.get('turns')==='2') $('btnTurns').click();
if(params.get('strong')==='1') $('btnStrong').click();
if(params.get('auto')==='1') $('btnAuto').click();
if(params.get('spin')==='1') $('btnSpin').click();
if(params.get('lenz')==='1') $('btnLenz').click();
if(params.get('z')) S.z=Math.max(Z_NEAR,Math.min(Z_FAR,+params.get('z')));
if(params.get('quiz')==='1') setTimeout(startQuiz,300);
$('posSlider').value=sliderFromZ(S.z);
$('posVal').textContent=posWord(+$('posSlider').value);
$('spinSlider').oninput.call($('spinSlider'));
registerLabels();
refreshPanelRects();
autoFit();
S.prevZ=S.z;
updateScene(0);
animate();
</script>
